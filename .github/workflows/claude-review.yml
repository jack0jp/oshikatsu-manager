# 何を守っているか:
# PRの自己チェックとしてClaudeにレビューさせる。実装したモデルとは別視点でのレビューを
# 全PRで自動発火させ、人間が起動を依頼する工程を挟まない(docs/prd.md 8.5)。
# 判定はあくまで参考。マージ可否の最終判断は人間が行う(docs/prd.md 8.6)。
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: check
        run: |
          if [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN が未設定のためClaudeレビューをスキップします。'claude setup-token' で発行してリポジトリシークレットに追加してください。"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.check.outputs.enabled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            このPRをレビューしてください。CLAUDE.mdとdocs/(prd.md, data-model.md,
            permissions.md, lint-policy.md, testing.md)の方針に沿っているかを重点的に見ること。

            特に確認する観点:
            - `as` キャスト、`any`、`eslint-disable`や`@ts-ignore`によるエラーの黙殺がないか
            - common/ に置くべき判断ロジックがapp/やmcp/に複製・直書きされていないか
            - 権限判定・削除時の分岐・公開設定の既定値など、静かに失敗する変更に
              テスト(特に否定側のテスト)が伴っているか
            - 型を手書きせず、生成型かZodスキーマのz.inferから導出しているか

            指摘はPRへのレビューコメントとして投稿してください。コードの自動修正は行わないこと。
