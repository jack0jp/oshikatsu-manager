# 何を守っているか:
# フェーズ1でSupabaseが導入された後、db test(RLS検証含む)と生成型のコミット漏れが
# 検出されずにmainへ入ることを防ぐゲート(docs/prd.md 8.2「生成型の運用」/ 8.6)。
# supabase/ が未初期化の現時点(フェーズ0)では `supabase/config.toml` が無いことを
# 検出してジョブ本体をスキップし、空で成立させる(docs/roadmap.md フェーズ0の注意点)。
# `supabase init` 後は自動的に実検証へ切り替わる。
# Supabase CLIのバージョンはローカルと揃えて固定する(ずれると「マイグレーション忘れ」
# ではなく「CLI差」で落ち、誰も信じなくなるため)。
name: Supabase

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: "2.111.0"

jobs:
  db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - name: Check for supabase/config.toml
        id: check
        run: |
          if [ -f supabase/config.toml ]; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::supabase/config.toml が無いため supabase start をスキップします(フェーズ1で有効化)。yarn test:db はこのまま実行します。"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.initialized == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - run: supabase start
        if: steps.check.outputs.initialized == 'true'

      - run: yarn test:db

  types-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - name: Check for supabase/config.toml
        id: check
        run: |
          if [ -f supabase/config.toml ]; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::supabase/config.toml が無いため型検証をスキップします(フェーズ1で有効化)。"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.initialized == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - run: supabase start
        if: steps.check.outputs.initialized == 'true'

      - run: yarn gen:types
        if: steps.check.outputs.initialized == 'true'

      - name: supabase/types.ts に差分がないことを確認
        if: steps.check.outputs.initialized == 'true'
        # git diff だけだと未追跡ファイル(コミットし忘れ)を検出できないため、
        # 一旦stageしてから差分を見る。既存の内容と一致していればstageしても差分は出ない。
        run: |
          git add -A -- supabase/types.ts
          git diff --cached --exit-code -- supabase/types.ts
